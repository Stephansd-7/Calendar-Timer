<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta name="theme-color" content="#E8ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF1; --surface:#F6F8FA; --ink:#152033; --muted:#66758A; --line:#CBD3DE;
  --accent:#2450E0; --accent-ink:#FFFFFF; --hit:#1B7A4B; --miss:#B23A32; --warn:#9A5B00; --track:#D5DCE6;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F141B; --surface:#171E28; --ink:#E7ECF3; --muted:#8A98AB; --line:#2A3442;
    --accent:#6E90FF; --accent-ink:#0F141B; --hit:#4CC38A; --miss:#F0837A; --warn:#E9B44C; --track:#2A3442;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px; line-height:1.45;
}
.wrap{
  max-width:620px; margin:0 auto;
  padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(72px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
header{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
h1{margin:0; font-size:1.15rem; font-weight:700; letter-spacing:-.01em}
.date{color:var(--muted); font-size:.9rem}
nav{display:flex; gap:22px; margin:18px 0 6px; border-bottom:1px solid var(--line)}
.tab{
  font:inherit; font-weight:500; color:var(--muted); background:none; border:0;
  padding:10px 0 12px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.banner{margin-top:14px; padding:14px 16px; border:1.5px solid var(--warn); border-radius:10px; background:var(--surface)}
.banner p{margin:0 0 10px}
.banner .brow{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.banner .bat{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; color:var(--muted); font-size:.9rem}
.banner input[type=time]{width:auto; min-height:38px}

.summary{display:flex; gap:28px; padding:16px 0 4px; color:var(--muted); font-size:.95rem}
.summary b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}

.row{padding:22px 0 20px; border-bottom:1px solid var(--line); position:relative}
.row.running::before{content:""; position:absolute; left:-16px; top:0; bottom:0; width:4px; background:var(--accent)}
.row-top{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px}
.name{font-size:1rem; font-weight:600; margin:0; overflow-wrap:anywhere}
.actions{display:flex; align-items:center; gap:14px; flex-shrink:0}
.time{display:flex; align-items:baseline; flex-wrap:wrap}
.done{
  font-size:clamp(2.6rem,11vw,3.8rem); font-weight:600; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; line-height:1;
}
.of{color:var(--muted); margin-left:.7rem; font-size:1rem}
.track{height:6px; background:var(--track); border-radius:3px; margin-top:14px; overflow:hidden}
.track i{display:block; height:100%; width:0; background:var(--accent)}
.row.hit .track i{background:var(--hit)}
.status{font-size:.875rem; color:var(--muted); margin-top:8px; display:flex; justify-content:space-between; gap:12px}
.row.hit .status-text{color:var(--hit); font-weight:500}
.row.extra .done{color:var(--muted)}
.row.extra.running .done{color:var(--ink)}

.btn{
  font:inherit; font-weight:600; min-height:44px; padding:0 22px; border-radius:8px; cursor:pointer;
  border:1.5px solid var(--accent); background:var(--accent); color:var(--accent-ink);
}
.btn.stop{background:transparent; color:var(--ink); border-color:var(--ink)}
.btn.small{min-height:36px; padding:0 14px; font-size:.9rem}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.linkbtn{font:inherit; font-size:.875rem; color:var(--muted); background:none; border:0; padding:6px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.linkbtn:disabled{opacity:.4; cursor:not-allowed; text-decoration:none}

h2.section{font-size:.95rem; font-weight:600; margin:32px 0 6px}
.log,.off{list-style:none; margin:0; padding:0}
.log li{display:grid; grid-template-columns:auto 1fr auto auto; gap:6px 14px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.log .rng{color:var(--muted); font-variant-numeric:tabular-nums}
.log .dur{font-variant-numeric:tabular-nums; font-weight:500}
.tag{font-style:normal; font-size:.78rem; color:var(--warn); margin-left:6px}
.trim-form{grid-column:1 / -1; padding:6px 0 8px; display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.trim-form input[type=time]{width:auto; min-height:38px}
.trim-form .hint{flex-basis:100%; margin:0}
.off li{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
.empty{color:var(--muted); padding:26px 0}

.big{display:flex; gap:36px; padding:22px 0 8px; flex-wrap:wrap}
.big div{display:flex; flex-direction:column}
.big strong{font-size:2.4rem; font-weight:600; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
.big span{color:var(--muted); font-size:.875rem; margin-top:6px}
.big .h strong{color:var(--hit)} .big .m strong{color:var(--miss)}
.acts{list-style:none; margin:0; padding:0}
.acts li{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:.95rem}
.acts .n{color:var(--muted); font-variant-numeric:tabular-nums}

.day{padding:16px 0; border-bottom:1px solid var(--line)}
.day-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
.day-head b{font-weight:600}
.verdict{font-size:.875rem; font-weight:600}
.verdict.h{color:var(--hit)} .verdict.m{color:var(--miss)}
.day ul{list-style:none; margin:0; padding:0; font-size:.9rem}
.day li{display:flex; justify-content:space-between; padding:2px 0; color:var(--muted)}
.day li.ok{color:var(--ink)}
.day li span:last-child{font-variant-numeric:tabular-nums}
.dnote{margin:6px 0 0; font-size:.8rem; color:var(--warn)}

.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-top:16px}
.seg button{font:inherit; font-weight:500; background:none; border:0; padding:0 18px; min-height:38px; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.pnav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px}
.pnav .lbl2{text-align:center}
.pnav .lbl2 b{display:block; font-weight:600}
.pnav .lbl2 span{color:var(--muted); font-size:.85rem}
.iconbtn{font:inherit; font-size:1.3rem; line-height:1; width:44px; height:44px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer}
.iconbtn:disabled{opacity:.35; cursor:not-allowed}
.chart{display:block; width:100%; max-width:560px; height:auto; margin-top:22px}
.chart .bar{fill:var(--accent); opacity:.55}
.chart .bar.today{opacity:1}
.chart .base{stroke:var(--line); stroke-width:1}
.chart .ax{fill:var(--muted); font-size:11px; font-family:inherit}
.chart .ax.dim{opacity:.5}
.alist{list-style:none; margin:0; padding:0}
.alist li{padding:14px 0; border-bottom:1px solid var(--line)}
.ahead{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
.an{font-weight:600; overflow-wrap:anywhere}
.at{font-variant-numeric:tabular-nums; font-weight:600}
.abar{height:6px; background:var(--track); border-radius:3px; margin-top:8px; overflow:hidden}
.abar i{display:block; height:100%; background:var(--accent)}
.asub{display:flex; justify-content:space-between; gap:12px; margin-top:6px; font-size:.85rem; color:var(--muted)}

.plan-item{border-bottom:1px solid var(--line)}
.plan-row{display:grid; grid-template-columns:1fr 88px auto; gap:10px; align-items:center; padding:12px 0 8px}
.dchips{display:flex; gap:6px; padding:0 0 12px; flex-wrap:wrap}
.dchip{
  font:inherit; font-size:.85rem; font-weight:600; width:38px; height:38px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:transparent; color:var(--muted);
}
.dchip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
input[type=text],input[type=number],input[type=time]{
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
  border-radius:8px; padding:0 12px; min-height:44px; width:100%;
}
input:disabled{opacity:.55}
.hint{color:var(--muted); font-size:.85rem; margin:10px 0 0}
.addrow{display:grid; grid-template-columns:1fr 88px auto; gap:10px; margin-top:12px}
.addchips{padding-top:12px}
.tools{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
label.lbl{display:block; font-size:.85rem; color:var(--muted); margin:18px 0 0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (max-width:420px){
  .plan-row,.addrow{grid-template-columns:1fr 78px}
  .plan-row .linkbtn,.addrow .btn{grid-column:1 / -1; justify-self:start}
  .log li{grid-template-columns:auto 1fr auto}
  .log li .linkbtn{grid-column:1 / -1; justify-self:start; padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tally</h1>
    <div class="date" id="today-date"></div>
  </header>
  <div id="banner"></div>
  <nav role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-view="today">Today</button>
    <button class="tab" role="tab" data-view="history">History</button>
    <button class="tab" role="tab" data-view="stats">Stats</button>
    <button class="tab" role="tab" data-view="plan">Plan</button>
  </nav>
  <main id="main"></main>
  <input type="file" id="importFile" accept="application/json" class="sr" tabindex="-1" aria-hidden="true">
</div>

<script>
(function(){
'use strict';

/* ---------- constants & helpers ---------- */
var KEY = 'tally.v1';
var HOUR = 3600000;
var PROMPT_FIRST = 3*HOUR;   /* ask "still going?" after this long */
var PROMPT_AGAIN = 2*HOUR;   /* and again this long after "still going" */
var WD_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var WD_LET  = ['S','M','T','W','T','F','S'];
var WD_ORDER = [1,2,3,4,5,6,0];       /* Monday first */
var ALL_DAYS = [0,1,2,3,4,5,6];

var pad = function(n){ return String(n).padStart(2,'0'); };
var dkey = function(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var uid = function(){ return Math.random().toString(36).slice(2,10); };
var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

function parseKey(k){ var p = k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function dayRange(k){ var s = parseKey(k); return [s.getTime(), addDays(s,1).getTime()]; }
/* timestamp for clock time hm=['HH','MM'] on the calendar day of ts, shifted by `shift` days */
function atTime(ts, hm, shift){
  var b = new Date(ts);
  return new Date(b.getFullYear(), b.getMonth(), b.getDate()+shift, +hm[0], +hm[1], 0, 0).getTime();
}

/* ---------- state ---------- */
function blank(){ return {activities:[], days:{}, sessions:[], running:null}; }
function normalize(r){
  if(!(r && Array.isArray(r.activities) && r.days && Array.isArray(r.sessions))) return null;
  r.activities.forEach(function(a){ if(!Array.isArray(a.days) || !a.days.length) a.days = ALL_DAYS.slice(); });
  if(!('running' in r)) r.running = null;
  return r;
}
function load(){
  try{ var r = normalize(JSON.parse(localStorage.getItem(KEY))); if(r) return r; }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var S = load();
var view = 'today';
var curDay = dkey();
var trimId = null;
var statsKind = 'week';
var statsOffset = 0;
var newDays = ALL_DAYS.slice();
var bannerKey = '';

function findAct(id){ return S.activities.find(function(x){ return x.id===id; }); }
function actName(id){ var a = findAct(id); return a ? a.name : 'Removed activity'; }

/* Each day keeps a snapshot of its targets, taken the first time the day is opened.
   Only activities scheduled for that weekday are in it. target 0 = unplanned extra. */
function ensureToday(){
  var k = dkey(), wd = new Date().getDay(), changed = false;
  if(!S.days[k]){
    S.days[k] = {targets:{}}; changed = true;
    S.activities.forEach(function(a){
      if(!a.archived && a.days.indexOf(wd)!==-1) S.days[k].targets[a.id] = {name:a.name, target:a.target};
    });
  }
  if(S.running && !S.days[k].targets[S.running.actId]){
    S.days[k].targets[S.running.actId] = {name:actName(S.running.actId), target:0, extra:true}; changed = true;
  }
  if(changed) save();
}

/* ---------- time maths (sessions are clipped to day boundaries, so overnight sessions split correctly) ---------- */
function clip(s, e, a, b){ var lo = Math.max(s,a), hi = Math.min(e,b); return hi > lo ? hi-lo : 0; }
function msIn(actId, a, b, now){
  var t = 0;
  for(var i=0;i<S.sessions.length;i++){
    var s = S.sessions[i];
    if(actId===null || s.actId===actId) t += clip(s.start, s.end, a, b);
  }
  if(S.running && (actId===null || S.running.actId===actId)) t += clip(S.running.start, now, a, b);
  return t;
}
function doneMs(k, actId, now){ var r = dayRange(k); return msIn(actId, r[0], r[1], now || Date.now()); }
function dayTotal(k, now){ var r = dayRange(k); return msIn(null, r[0], r[1], now || Date.now()); }
function sessionCount(k, actId){
  var r = dayRange(k), n = 0;
  S.sessions.forEach(function(s){ if(s.actId===actId && clip(s.start, s.end, r[0], r[1])>0) n++; });
  if(S.running && S.running.actId===actId && clip(S.running.start, Date.now(), r[0], r[1])>0) n++;
  return n;
}
function trimmedCount(k){
  var r = dayRange(k), n = 0;
  S.sessions.forEach(function(s){ if(s.trimmedFrom && clip(s.start, s.end, r[0], r[1])>0) n++; });
  return n;
}
function fmtClock(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
}
function fmtMin(min){
  var h = Math.floor(min/60), m = min%60;
  if(h && m) return h+'h '+m+'m';
  if(h) return h+'h';
  return m+'m';
}
function fmtMs(ms){ return fmtMin(Math.round(ms/60000)); }
function hhmm(ts){ var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtShort(d){ return d.toLocaleDateString(undefined, {day:'numeric', month:'short'}); }
function statusText(done, tm){
  if(done >= tm){
    var over = Math.floor((done-tm)/60000);
    return over >= 1 ? 'Target hit, '+fmtMin(over)+' over' : 'Target hit';
  }
  return fmtMin(Math.ceil((tm-done)/60000))+' left';
}

/* ---------- actions ---------- */
function stopRunning(){
  if(!S.running) return;
  var end = Date.now();
  if(end - S.running.start >= 1000) S.sessions.push({id:uid(), actId:S.running.actId, start:S.running.start, end:end});
  S.running = null;
}
function startTimer(id){
  stopRunning();
  ensureToday();
  var t = S.days[dkey()].targets;
  if(!t[id]) t[id] = {name:actName(id), target:0, extra:true};
  S.running = {actId:id, start:Date.now()};
  save(); render();
}
function stopTimer(){ stopRunning(); save(); render(); }
function discardTimer(){
  if(!S.running) return;
  if(!confirm('Discard this running session? It will not be logged.')) return;
  S.running = null; save(); render();
}
function isLocked(id){ return doneMs(dkey(), id) > 0 || (S.running && S.running.actId===id); }

/* Forgotten timer: end the running session at an earlier clock time. Marked as trimmed. */
function stopAt(){
  var el = document.getElementById('stopAt');
  if(!S.running || !el || !el.value){ if(el) el.focus(); return; }
  var hm = el.value.split(':'), now = Date.now();
  var cand = atTime(now, hm, 0);
  if(cand > now) cand = atTime(now, hm, -1);
  if(cand <= S.running.start + 999){
    alert('Pick a time after the timer started ('+hhmm(S.running.start)+').');
    return;
  }
  S.sessions.push({id:uid(), actId:S.running.actId, start:S.running.start, end:cand, trimmedFrom:now});
  S.running = null; save(); render();
}

/* Trim a logged session. Can only shorten it, never extend. */
function trimSave(sid){
  var s = S.sessions.find(function(x){ return x.id===sid; });
  var el = document.getElementById('trimAt');
  if(!s || !el || !el.value) return;
  var hm = el.value.split(':');
  var cand = atTime(s.end, hm, 0);
  if(cand >= s.end) cand = atTime(s.end, hm, -1);
  if(cand <= s.start + 999 || cand >= s.end){
    alert('Pick a time after the session started ('+hhmm(s.start)+') and before it ended ('+hhmm(s.end)+'). Trimming can only shorten a session.');
    return;
  }
  if(!s.trimmedFrom) s.trimmedFrom = s.end;
  s.end = cand;
  trimId = null; save(); render();
}

/* keep today's snapshot in step with a schedule change */
function syncToday(a){
  var k = dkey(), wd = new Date().getDay(), t = S.days[k].targets;
  if(a.days.indexOf(wd)!==-1){
    if(!t[a.id]) t[a.id] = {name:a.name, target:a.target};
    else if(t[a.id].extra){ t[a.id].target = a.target; delete t[a.id].extra; }
  }else if(t[a.id] && !t[a.id].extra && !isLocked(a.id)){
    delete t[a.id];
  }
}

/* ---------- views: today ---------- */
function todayHTML(){
  var k = dkey();
  var tg = S.days[k].targets;
  var ids = Object.keys(tg).sort(function(a,b){ return (tg[b].target>0) - (tg[a].target>0); });
  var off = S.activities.filter(function(a){ return !a.archived && !tg[a.id]; });

  if(!ids.length && !off.length){
    return '<p class="empty">No activities yet. Open Plan and add one, for example Studying with 5 hours.</p>';
  }

  var rows = ids.map(function(id){
    var t = tg[id];
    var planned = t.target > 0;
    var running = S.running && S.running.actId===id;
    var n = sessionCount(k, id);
    return '<article class="row'+(running?' running':'')+(planned?'':' extra')+'" data-id="'+id+'" data-target="'+t.target+'">'+
      '<div class="row-top"><h2 class="name">'+esc(t.name)+'</h2><div class="actions">'+
        (running ? '<button class="linkbtn" data-act="discard">Discard</button>' : '')+
        (running ? '<button class="btn stop" data-act="stop">Stop</button>'
                 : '<button class="btn" data-act="start" data-id="'+id+'">Start</button>')+
      '</div></div>'+
      '<div class="time"><span class="done">0:00:00</span><span class="of">'+(planned ? 'of '+fmtMin(t.target) : 'not planned today')+'</span></div>'+
      (planned ? '<div class="track"><i></i></div>' : '')+
      '<div class="status"><span class="status-text"></span><span>'+n+(n===1?' session':' sessions')+' today</span></div>'+
    '</article>';
  }).join('');
  if(!ids.length) rows = '<p class="empty">Nothing is planned for today.</p>';

  var offHTML = off.length
    ? '<h2 class="section">Not planned today</h2><ul class="off">'+off.map(function(a){
        return '<li><span>'+esc(a.name)+'</span><button class="btn ghost small" data-act="start" data-id="'+a.id+'">Start anyway</button></li>';
      }).join('')+'</ul>'
    : '';

  /* today's log: sessions clipped to today, so an overnight session shows only its part after midnight */
  var r = dayRange(k), now = Date.now(), segs = [];
  S.sessions.forEach(function(s){
    var lo = Math.max(s.start, r[0]), hi = Math.min(s.end, r[1]);
    if(hi > lo) segs.push({s:s, lo:lo, hi:hi, running:false});
  });
  if(S.running){
    var lo = Math.max(S.running.start, r[0]), hi = Math.min(now, r[1]);
    if(hi > lo) segs.push({s:S.running, lo:lo, hi:hi, running:true});
  }
  segs.sort(function(a,b){ return a.lo - b.lo; });
  var log = segs.map(function(g){
    var s = g.s;
    var li = '<li><span class="rng">'+hhmm(g.lo)+'–'+(g.running?'now':hhmm(g.hi))+'</span>'+
      '<span>'+esc(actName(s.actId))+
        (s.start < r[0] ? '<em class="tag">carried over from yesterday</em>' : '')+
        (s.trimmedFrom ? '<em class="tag">trimmed, was '+hhmm(s.trimmedFrom)+'</em>' : '')+
      '</span>'+
      '<span class="dur">'+(g.running ? 'running' : fmtClock(g.hi-g.lo))+'</span>'+
      (g.running ? '<span></span>' : '<button class="linkbtn" data-act="trim" data-sid="'+s.id+'">Trim</button>');
    if(!g.running && trimId===s.id){
      li += '<div class="trim-form"><label for="trimAt">Actually ended at</label>'+
        '<input type="time" id="trimAt" value="'+hhmm(s.end)+'">'+
        '<button class="btn small" data-act="trimsave" data-sid="'+s.id+'">Save</button>'+
        '<button class="linkbtn" data-act="trimcancel">Cancel</button>'+
        '<p class="hint">Trimming can only shorten a session. The log keeps a note that it was trimmed.</p></div>';
    }
    return li + '</li>';
  });

  return '<div class="summary"><span><b id="sumTotal">0m</b> logged</span><span><b id="sumHit">0 of 0</b> targets hit</span></div>'+
    rows + offHTML+
    '<h2 class="section">Today\'s log</h2>'+
    (log.length ? '<ul class="log">'+log.join('')+'</ul>' : '<p class="empty" style="padding-top:8px">Nothing logged yet.</p>');
}

/* ---------- views: history ---------- */
function historyData(){
  var today = dkey();
  var keys = Object.keys(S.days).filter(function(k){ return k < today; }).sort().reverse();
  var out = [];
  keys.forEach(function(k){
    var tg = S.days[k].targets;
    var ids = Object.keys(tg).filter(function(id){ return tg[id].target > 0; });
    if(!ids.length) return;
    var met = 0;
    var items = ids.map(function(id){
      var d = doneMs(k, id);
      var ok = d >= tg[id].target*60000;
      if(ok) met++;
      return {id:id, name:tg[id].name, done:d, target:tg[id].target, ok:ok};
    });
    out.push({k:k, met:met, n:ids.length, hit:met===ids.length, items:items, trimmed:trimmedCount(k)});
  });
  return out;
}

function historyHTML(){
  var data = historyData();
  if(!data.length){
    return '<p class="empty">No finished days yet. A day shows up here once it ends.</p>';
  }
  var hit = data.filter(function(d){ return d.hit; }).length;
  var missed = data.length - hit;

  var per = {};
  data.forEach(function(d){
    d.items.forEach(function(it){
      if(!per[it.id]) per[it.id] = {name:it.name, planned:0, hit:0};
      per[it.id].name = it.name;
      per[it.id].planned++;
      if(it.ok) per[it.id].hit++;
    });
  });
  var perHTML = Object.keys(per).map(function(id){
    var p = per[id];
    return '<li><span>'+esc(p.name)+'</span><span class="n">hit '+p.hit+' of '+p.planned+' planned days</span></li>';
  }).join('');

  var days = data.slice(0, 60).map(function(d){
    var label = parseKey(d.k).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
    var lines = d.items.map(function(it){
      return '<li class="'+(it.ok?'ok':'')+'"><span>'+esc(it.name)+'</span><span>'+fmtMin(Math.floor(it.done/60000))+' / '+fmtMin(it.target)+'</span></li>';
    }).join('');
    return '<div class="day"><div class="day-head"><b>'+label+'</b>'+
      '<span class="verdict '+(d.hit?'h':'m')+'">'+(d.hit ? 'Hit' : 'Missed, '+d.met+' of '+d.n+' targets')+'</span></div>'+
      '<ul>'+lines+'</ul>'+
      (d.trimmed ? '<p class="dnote">Includes '+d.trimmed+(d.trimmed===1?' trimmed session':' trimmed sessions')+'</p>' : '')+
    '</div>';
  }).join('');

  return '<div class="big"><div class="h"><strong>'+hit+'</strong><span>days hit</span></div>'+
    '<div class="m"><strong>'+missed+'</strong><span>days missed</span></div>'+
    '<div><strong>'+data.length+'</strong><span>days tracked</span></div></div>'+
    '<p class="hint" style="margin-bottom:0">A day counts as hit when every planned target was met. Days an activity isn\'t scheduled don\'t count against it. Today counts once it ends.</p>'+
    '<h2 class="section">By activity</h2><ul class="acts">'+perHTML+'</ul>'+
    '<h2 class="section">Days</h2>'+days;
}

/* ---------- views: stats ---------- */
function periodDays(kind, offset){
  var now = new Date(), start, end;
  if(kind==='week'){
    var mon = addDays(now, -((now.getDay()+6)%7));
    start = addDays(mon, offset*7); end = addDays(start, 7);
  }else{
    start = new Date(now.getFullYear(), now.getMonth()+offset, 1);
    end = new Date(now.getFullYear(), now.getMonth()+offset+1, 1);
  }
  var days = [];
  for(var d = start; d < end; d = addDays(d,1)) days.push(dkey(d));
  return {days:days, start:start, last:addDays(end,-1)};
}

/* Averages use completed days only (before today), so a day in progress doesn't drag them down. */
function periodStats(p){
  var today = dkey(), now = Date.now();
  var totals = p.days.map(function(k){ return dayTotal(k, now); });
  var total = 0, ctotal = 0, n = 0;
  p.days.forEach(function(k,i){ total += totals[i]; if(k < today){ ctotal += totals[i]; n++; } });
  var acts = S.activities.map(function(a){
    var t = 0, c = 0;
    p.days.forEach(function(k){ var d = doneMs(k, a.id, now); t += d; if(k < today) c += d; });
    return {id:a.id, name:a.name, archived:!!a.archived, total:t, ctotal:c};
  });
  return {days:p.days, totals:totals, total:total, n:n, avg:n ? ctotal/n : null, acts:acts};
}

function deltaText(avg, prevAvg, label){
  if(avg===null || prevAvg===null) return '';
  var diff = Math.round((avg-prevAvg)/60000);
  if(Math.abs(diff) < 5) return 'About the same as '+label;
  return fmtMin(Math.abs(diff))+'/day '+(diff>0 ? 'more' : 'less')+' than '+label;
}

function chartSVG(days, totals, kind){
  var W = 480, H = 170, pl = 6, pr = 6, pt = 18, pb = 24, n = days.length, today = dkey();
  var max = Math.max.apply(null, totals.concat([HOUR]));
  max = Math.ceil(max/HOUR)*HOUR;
  var iw = W-pl-pr, ih = H-pt-pb, slot = iw/n, bw = Math.min(slot*0.62, 44);
  var out = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Time logged per day">';
  out += '<text class="ax" x="'+pl+'" y="11">'+(max/HOUR)+'h</text>';
  out += '<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ih)+'" y2="'+(pt+ih)+'"/>';
  days.forEach(function(k,i){
    var x = pl + slot*i + (slot-bw)/2;
    var d = parseKey(k);
    if(totals[i] > 0){
      var h = Math.max(2, totals[i]/max*ih);
      out += '<rect class="bar'+(k===today?' today':'')+'" x="'+x.toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2">'+
        '<title>'+esc(d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}))+': '+fmtMs(totals[i])+'</title></rect>';
    }
    var lbl = kind==='week'
      ? d.toLocaleDateString(undefined, {weekday:'short'})
      : ((i===0 || (i+1)%5===0) ? String(d.getDate()) : '');
    if(lbl) out += '<text class="ax'+(k>today?' dim':'')+'" x="'+(pl+slot*i+slot/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(lbl)+'</text>';
  });
  return out + '</svg>';
}

function statsHTML(){
  var kind = statsKind, off = statsOffset;
  var pd = periodDays(kind, off);
  var cur = periodStats(pd);
  var prev = periodStats(periodDays(kind, off-1));
  var prevLabel = off===0 ? 'last '+kind : 'the previous '+kind;

  var label = kind==='week'
    ? fmtShort(pd.start)+' – '+fmtShort(pd.last)
    : pd.start.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  var sub = off===0 ? 'This '+kind : '';

  var head =
    '<div class="seg" role="group" aria-label="Period">'+
      '<button data-act="kind" data-kind="week" aria-pressed="'+(kind==='week')+'">Week</button>'+
      '<button data-act="kind" data-kind="month" aria-pressed="'+(kind==='month')+'">Month</button>'+
    '</div>'+
    '<div class="pnav">'+
      '<button class="iconbtn" data-act="prev" aria-label="Earlier">‹</button>'+
      '<div class="lbl2"><b>'+esc(label)+'</b><span>'+esc(sub)+'&nbsp;</span></div>'+
      '<button class="iconbtn" data-act="next" aria-label="Later"'+(off>=0?' disabled':'')+'>›</button>'+
    '</div>';

  if(cur.total === 0){
    return head + '<p class="empty">Nothing logged in this period.</p>';
  }

  var prevAvgAll = (prev.n && prev.total>0) ? prev.avg : null;
  var allDelta = deltaText(cur.avg, prevAvgAll, prevLabel);

  var prevAct = {};
  prev.acts.forEach(function(a){ prevAct[a.id] = a; });
  var list = cur.acts.filter(function(a){ return !a.archived || a.total>0; })
                     .sort(function(a,b){ return b.total - a.total; });
  var max = list.length ? list[0].total : 0;

  var items = list.map(function(a){
    var avg = cur.n ? a.ctotal/cur.n : null;
    var pa = prevAct[a.id];
    var pAvg = (pa && prev.n && prev.total>0) ? pa.ctotal/prev.n : null;
    return '<li><div class="ahead"><span class="an">'+esc(a.name)+'</span><span class="at">'+fmtMs(a.total)+'</span></div>'+
      '<div class="abar"><i style="width:'+(max ? (a.total/max*100).toFixed(1) : 0)+'%"></i></div>'+
      '<div class="asub"><span>'+(avg===null ? 'No completed days yet' : fmtMs(avg)+'/day')+'</span><span>'+esc(deltaText(avg, pAvg, prevLabel))+'</span></div></li>';
  }).join('');

  return head +
    '<div class="big"><div><strong>'+fmtMs(cur.total)+'</strong><span>logged</span></div>'+
    '<div><strong>'+(cur.avg===null ? '–' : fmtMs(cur.avg))+'</strong><span>average per day</span></div></div>'+
    (allDelta ? '<p class="hint" style="margin-top:6px">'+esc(allDelta)+'</p>' : '')+
    chartSVG(cur.days, cur.totals, kind)+
    '<h2 class="section">By activity</h2><ul class="alist">'+items+'</ul>'+
    '<p class="hint">Averages use completed days only, so today doesn\'t pull them down. Totals include today.</p>';
}

/* ---------- views: plan ---------- */
function chipsHTML(days, act, id){
  return '<div class="dchips" role="group" aria-label="Days of the week">'+WD_ORDER.map(function(d){
    return '<button type="button" class="dchip" data-act="'+act+'" data-day="'+d+'"'+(id?' data-id="'+id+'"':'')+
      ' aria-pressed="'+(days.indexOf(d)!==-1)+'" title="'+WD_FULL[d]+'" aria-label="'+WD_FULL[d]+'">'+WD_LET[d]+'</button>';
  }).join('')+'</div>';
}

function planHTML(){
  var list = S.activities.filter(function(a){ return !a.archived; });
  var rows = list.map(function(a){
    var locked = isLocked(a.id);
    return '<div class="plan-item" data-id="'+a.id+'"><div class="plan-row">'+
      '<input type="text" data-field="name" value="'+esc(a.name)+'" aria-label="Activity name" maxlength="60">'+
      '<input type="number" data-field="hours" value="'+(+(a.target/60).toFixed(2))+'" min="0.25" step="0.25" aria-label="Daily target in hours"'+(locked?' disabled':'')+'>'+
      '<button class="linkbtn" data-act="remove" data-id="'+a.id+'"'+(locked?' disabled':'')+'>Remove</button>'+
    '</div>'+chipsHTML(a.days, 'day', a.id)+'</div>';
  }).join('');
  return '<label class="lbl">Daily target in hours, and the days it applies</label>'+
    (rows || '<p class="empty" style="padding:10px 0 0">Nothing here yet.</p>')+
    '<p class="hint">Target and Remove lock once you log time on an activity today, so a bad day can\'t be edited into a good one. Days can be changed any time. Days you switch off don\'t count against you.</p>'+
    '<label class="lbl">Add an activity</label>'+
    '<div class="addrow"><input type="text" id="newName" placeholder="Studying" aria-label="New activity name" maxlength="60">'+
    '<input type="number" id="newHours" value="1" min="0.25" step="0.25" aria-label="Target in hours">'+
    '<button class="btn" data-act="add">Add</button></div>'+
    '<div class="addchips">'+chipsHTML(newDays, 'newday')+'</div>'+
    '<label class="lbl">Backup</label>'+
    '<div class="tools"><button class="btn ghost small" data-act="export">Export data</button>'+
    '<button class="btn ghost small" data-act="import">Import data</button></div>'+
    '<p class="hint">Data lives in this browser only. Export to move it to another device.</p>';
}

/* ---------- banner: forgotten timer ---------- */
var banner = document.getElementById('banner');
function needsPrompt(){
  if(!S.running) return false;
  var r = S.running;
  return Date.now() - (r.ackAt || r.start) >= (r.ackAt ? PROMPT_AGAIN : PROMPT_FIRST);
}
function renderBanner(){
  var key = needsPrompt() ? S.running.actId+':'+S.running.start+':'+(S.running.ackAt||0) : '';
  if(key === bannerKey){
    var el = document.getElementById('bElapsed');
    if(el && S.running) el.textContent = fmtMs(Date.now()-S.running.start);
    return;
  }
  bannerKey = key;
  if(!key){ banner.innerHTML = ''; return; }
  banner.innerHTML =
    '<div class="banner" role="alert">'+
      '<p><b>Still on '+esc(actName(S.running.actId))+'?</b> This timer has been running for <span id="bElapsed">'+fmtMs(Date.now()-S.running.start)+'</span>.</p>'+
      '<div class="brow"><button class="btn small" data-act="keep">Still going</button>'+
      '<button class="btn small stop" data-act="stop">Stop now</button></div>'+
      '<div class="bat"><label for="stopAt">Or it actually ended at</label>'+
      '<input type="time" id="stopAt"><button class="btn small ghost" data-act="stopat">Stop at that time</button></div>'+
    '</div>';
}

/* ---------- render ---------- */
var main = document.getElementById('main');
function render(){
  ensureToday();
  document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
  document.querySelectorAll('.tab').forEach(function(b){
    b.setAttribute('aria-selected', b.dataset.view===view ? 'true' : 'false');
  });
  main.innerHTML = view==='today' ? todayHTML()
                 : view==='history' ? historyHTML()
                 : view==='stats' ? statsHTML()
                 : planHTML();
  updateLive();
}

function updateLive(){
  var now = Date.now();
  var k = dkey();
  if(view==='today'){
    var total = 0, hit = 0, n = 0;
    main.querySelectorAll('.row[data-id]').forEach(function(r){
      var id = r.dataset.id;
      var t = S.days[k].targets[id];
      if(!t) return;
      var done = doneMs(k, id, now);
      var tm = t.target*60000;
      total += done;
      r.querySelector('.done').textContent = fmtClock(done);
      if(tm > 0){
        var ok = done >= tm;
        n++; if(ok) hit++;
        r.classList.toggle('hit', ok);
        r.querySelector('.track i').style.width = Math.min(100, done/tm*100)+'%';
        r.querySelector('.status-text').textContent = statusText(done, tm);
      }
    });
    var a = document.getElementById('sumTotal'), b = document.getElementById('sumHit');
    if(a) a.textContent = fmtMin(Math.floor(total/60000));
    if(b) b.textContent = hit+' of '+n;
  }
  if(S.running){
    document.title = fmtClock(doneMs(k, S.running.actId, now))+' '+actName(S.running.actId)+' · Tally';
  }else{
    document.title = 'Tally';
  }
  renderBanner();
}

function tick(){
  if(dkey() !== curDay){ curDay = dkey(); render(); return; }
  updateLive();
}

/* ---------- events ---------- */
document.querySelector('nav').addEventListener('click', function(e){
  var b = e.target.closest('.tab');
  if(!b) return;
  view = b.dataset.view;
  trimId = null;
  render();
});

function handle(e){
  var b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  var act = b.dataset.act, id = b.dataset.id, a;

  if(act==='start') startTimer(id);
  else if(act==='stop') stopTimer();
  else if(act==='discard') discardTimer();
  else if(act==='keep'){ if(S.running){ S.running.ackAt = Date.now(); save(); } renderBanner(); }
  else if(act==='stopat') stopAt();

  else if(act==='trim'){ trimId = b.dataset.sid; render(); var t = document.getElementById('trimAt'); if(t) t.focus(); }
  else if(act==='trimcancel'){ trimId = null; render(); }
  else if(act==='trimsave') trimSave(b.dataset.sid);

  else if(act==='kind'){ statsKind = b.dataset.kind; statsOffset = 0; render(); }
  else if(act==='prev'){ statsOffset--; render(); }
  else if(act==='next'){ if(statsOffset < 0){ statsOffset++; render(); } }

  else if(act==='newday'){
    var d = +b.dataset.day, i = newDays.indexOf(d);
    if(i===-1) newDays.push(d); else if(newDays.length > 1) newDays.splice(i,1); else return;
    b.setAttribute('aria-pressed', String(newDays.indexOf(d)!==-1));
  }
  else if(act==='day'){
    a = findAct(id); if(!a) return;
    var dd = +b.dataset.day, j = a.days.indexOf(dd);
    if(j===-1) a.days.push(dd); else if(a.days.length > 1) a.days.splice(j,1); else return;
    syncToday(a); save(); render();
  }
  else if(act==='add'){
    var nameEl = document.getElementById('newName');
    var hoursEl = document.getElementById('newHours');
    var name = nameEl.value.trim();
    var min = Math.round(parseFloat(hoursEl.value)*60);
    if(!name){ nameEl.focus(); return; }
    if(!(min >= 1)){ hoursEl.focus(); return; }
    var na = {id:uid(), name:name, target:min, days:newDays.slice()};
    S.activities.push(na);
    ensureToday();
    syncToday(na);
    newDays = ALL_DAYS.slice();
    save(); render();
  }
  else if(act==='remove'){
    if(isLocked(id)) return;
    a = findAct(id);
    if(a) a.archived = true;
    delete S.days[dkey()].targets[id];
    save(); render();
  }
  else if(act==='export'){
    var blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url; link.download = 'tally-'+dkey()+'.json';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  else if(act==='import') document.getElementById('importFile').click();
}
main.addEventListener('click', handle);
banner.addEventListener('click', handle);

main.addEventListener('change', function(e){
  var input = e.target;
  var item = input.closest('.plan-item');
  if(!item || !input.dataset.field) return;
  var id = item.dataset.id;
  var a = findAct(id);
  if(!a) return;
  var today = S.days[dkey()].targets[id];

  if(input.dataset.field==='name'){
    var v = input.value.trim();
    if(!v){ input.value = a.name; return; }
    a.name = v;
    if(today) today.name = v;
  }else if(input.dataset.field==='hours'){
    if(isLocked(id)){ input.value = +(a.target/60).toFixed(2); return; }
    var min = Math.round(parseFloat(input.value)*60);
    if(!(min >= 1)){ input.value = +(a.target/60).toFixed(2); return; }
    a.target = min;
    if(today && !today.extra) today.target = min;
  }
  save(); render();
});

document.getElementById('importFile').addEventListener('change', function(e){
  var f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var r = normalize(JSON.parse(reader.result));
      if(!r) throw new Error('bad');
      if(!confirm('Replace everything in this browser with the imported data?')) return;
      S = r;
      save(); render();
    }catch(err){
      alert('That file is not a Tally export.');
    }
  };
  reader.readAsText(f);
});

/* ---------- go ---------- */
render();
setInterval(tick, 1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
</body>
</html>
